name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release inputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run check:release -- "$RELEASE_TAG"
          git diff --exit-code -- wipegram.user.js
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" wipegram.user.js "dist/wipegram-chromium-$VERSION.zip" "dist/wipegram-firefox-$VERSION.zip" LICENSE dist/release/SHA256SUMS --verify-tag --title "Wipegram $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
