<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Wipegram</title>
  <desc id="description">Your Telegram messages. A fresh start. Scan, review, clean.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101211"/>
      <stop offset="1" stop-color="#1b1e1c"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#4ade80"/>
      <stop offset="1" stop-color="#86b99a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#86b99a" opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>
  <circle cx="1105" cy="20" r="170" fill="#86b99a" opacity=".05"/>
  <circle cx="1050" cy="285" r="125" fill="#4ade80" opacity=".05"/>
  <!-- BRAND_MARK_START -->
  <svg x="56" y="64" width="104" height="104" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#101211"/>
  <path d="m14 39 15 51h12l10-30 9 30h12l16-51H74l-9 30-9-30H44L35 69l-7-30Z" fill="#e8ebe9"/>
  <path d="M103 39h15L97 90H82Z" fill="#4ade80"/></svg>
