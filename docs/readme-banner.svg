    <text x="190" y="101" fill="#4ade80" font-size="12" font-weight="700" letter-spacing="3">A FRESH START FOR YOUR CHATS</text>
    <text x="186" y="161" fill="#e8ebe9" font-size="64" font-weight="750" letter-spacing="-2">Wipegram</text>
    <text x="58" y="219" fill="#bdc8c0" font-size="22">Your Telegram messages. Your cleanup.</text>
    <text x="58" y="253" fill="#86b99a" font-size="15">Scan first. Review your matches. Delete with control.</text>
